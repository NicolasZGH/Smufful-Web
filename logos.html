    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            <div class="lightbox-counter">
                <span id="current-image">1</span> / <span id="total-images">6</span>
            </div>
            <button class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">‹</button>
            <img id="lightbox-img" class="lightbox-image" src="" alt="">
            <button class="lightbox-nav lightbox-next" onclick="changeImage(1)">›</button>
            <div class="lightbox-info">
                <h3 id="lightbox-title" class="lightbox-title"></h3>
                <p id="lightbox-desc" class="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <script>
        // Datos de las imágenes
        const images = [
            {
                src: "images/drawings/logos/presentacion-crackheadkatz.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-fatalblow.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-hanamori.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-hellomaryhouse.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-naturlaisticphotos.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-ondipuri.webp",
                title: "Logo Design",
            },
            {
                src: "images/drawings/logos/presentacion-reddish.webp",
                title: "Logo Design",
            },
                        {
                src: "images/drawings/logos/presentacion-kuma.webp",
                title: "Logo Design",
            }
        ];
        // Variables para el lightbox

        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentImageIndex += direction;
            
            if (currentImageIndex >= images.length) {
                currentImageIndex = 0;
            } else if (currentImageIndex < 0) {
                currentImageIndex = images.length - 1;
            }
            
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const currentImage = images[currentImageIndex];
            document.getElementById('lightbox-img').src = currentImage.src;
            document.getElementById('lightbox-title').textContent = currentImage.title;
            document.getElementById('lightbox-desc').textContent = currentImage.desc;
            document.getElementById('current-image').textContent = currentImageIndex + 1;
            document.getElementById('total-images').textContent = images.length;
        }

        // Soporte para swipe en el lightbox
        let touchStartX = 0;
        let touchEndX = 0;

        const lightbox = document.getElementById('lightbox');

        lightbox.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        lightbox.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleGesture();
        }, false);

        function handleGesture() {
            if (touchEndX < touchStartX - 40) {
                changeImage(1); // Siguiente imagen
            }
            if (touchEndX > touchStartX + 40) {
                changeImage(-1); // Imagen anterior
            }
        }

        // Cerrar lightbox con tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                changeImage(-1);
            } else if (e.key === 'ArrowRight') {
                changeImage(1);
            }
        });
        
        // Cerrar lightbox al hacer clic fuera de la imagen
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

            // Cambia a GIF al pasar el mouse y vuelve a la estática al salir
        document.querySelectorAll('.gallery-item img[data-gif]').forEach(img => {
            img.addEventListener('mouseenter', function() {
                this.src = this.dataset.gif;
            });
            img.addEventListener('mouseleave', function() {
                this.src = this.dataset.static;
            });
        });
    </script>

    <script>
        // Cargar el navbar dinámicamente
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;

                // Inicializar el botón hamburguesa después de cargar el navbar
                const menuToggle = document.getElementById('menu-toggle');
                if (menuToggle) {
                    menuToggle.onclick = function() {
                        document.getElementById('nav').classList.toggle('open');
                    };
                }

                // Marcar el enlace activo según la página actual
                const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                document.querySelectorAll('#nav ul li a').forEach(link => {
                    if (link.getAttribute('href') === currentPage) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            })
            .catch(error => console.error('Error al cargar el navbar:', error));
    </script>
